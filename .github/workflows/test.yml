name: Full Stack Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # JOB 1: TESTES DO BACKEND (PYTHON)
  backend-test:
    name: Backend Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize database
      run: |
        cd backend
        python scripts/init_db.py

    - name: Seed database
      run: |
        cd backend
        echo "s" | python scripts/seed_questions.py

    - name: Run tests with coverage
      run: |
        cd backend
        python -m pytest tests/ --cov=app --cov-report=term
    - name: Upload Backend coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage-${{ matrix.os }}
        fail_ci_if_error: false

  # JOB 2: TESTES DO FRONTEND (REACT)
  frontend-test:
    name: Frontend Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Frontend Tests
      # CI=true é essencial para o teste não ficar esperando input (watch mode)
      run: |
        cd frontend
        npm test
      env:
        CI: true
